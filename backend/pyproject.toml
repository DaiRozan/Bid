[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "technical-bid-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "python-docx>=1.1",
  "pypdf>=5.0",
  "PyMuPDF>=1.26",
  "python-multipart>=0.0.9",
  "uvicorn[standard]>=0.30",
  "xlrd>=2.0.1",
  "openpyxl>=3.1",
  "ezdxf>=1.4",
  "rarfile>=4.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

